name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R (pinned)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Setup renv and restore packages
        uses: r-lib/actions/setup-renv@v2

      # Packages used by the code under test or by the tests that renv.lock
      # does not list yet. Remove a name here once it is in the lockfile.
      - name: Install packages missing from the lockfile
        run: |
          Rscript -e 'needed <- c("testthat", "qpdf"); missing <- needed[!vapply(needed, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) install.packages(missing)'

      # No model service is called: the tests use fakes, and the live
      # regression test only runs when it is asked for.
      - name: Run tests
        run: |
          Rscript tests/testthat.R
