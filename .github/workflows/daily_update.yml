name: Daily arXiv refresh

on:
  schedule:
    # Every Day at 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      extraction_enabled:
        description: "Extract factsheets (false refreshes metadata only)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write

# Jobs that write data never run at the same time.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R (pinned)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libjpeg-dev \
            libpoppler-cpp-dev

      - name: Setup renv and restore packages
        uses: r-lib/actions/setup-renv@v2

      - name: Run daily update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          EXTRACTION_ENABLED: ${{ inputs.extraction_enabled || vars.EXTRACTION_ENABLED || 'true' }}
        run: |
          Rscript 01_daily_update.r

      - name: Commit updated data to GitHub
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/tracks.json
          git add data/spc_arxiv_metadata.csv data/spc_factsheet.csv
          git add data/exp_design_arxiv_metadata.csv data/exp_design_factsheet.csv
          git add data/reliability_arxiv_metadata.csv data/reliability_factsheet.csv
          if [ -d data/raw_v2 ]; then git add data/raw_v2; fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily update: arXiv metadata + factsheets for all tracks"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Hugging Face Space
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash tools/deploy_space.sh "https://fmegahed:${HF_TOKEN}@huggingface.co/spaces/fmegahed/arxiv_control_charts"
