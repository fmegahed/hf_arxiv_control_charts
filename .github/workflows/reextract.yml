name: Re-extract factsheets (manual)

# Runs one time-boxed chunk of the v2 backfill and commits the staging files
# to the branch it was started from. Run it again to continue. It never
# touches the published factsheets and never pushes to the Space.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track"
        type: choice
        options: ["all", "spc", "exp_design", "reliability"]
        default: "all"
      model:
        description: "Model id (blank uses the spec's extraction model)"
        type: string
        default: ""
      time_budget_min:
        description: "Minutes of extraction in this run"
        type: string
        default: "300"
      max_spend_usd:
        description: "Stop after this much spend in this run"
        type: string
        default: "60"
      retry_failed:
        description: "Retry papers that exhausted their attempts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  reextract:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Refuse to run on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Start this workflow from the re-extraction branch, not main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R (pinned)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libjpeg-dev libpoppler-cpp-dev

      - name: Setup renv and restore packages
        uses: r-lib/actions/setup-renv@v2

      - name: Run one chunk of the backfill
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          IN_TRACK: ${{ inputs.track }}
          IN_MODEL: ${{ inputs.model }}
          IN_TIME: ${{ inputs.time_budget_min }}
          IN_SPEND: ${{ inputs.max_spend_usd }}
          IN_RETRY: ${{ inputs.retry_failed }}
        run: |
          set -- --track "$IN_TRACK" --time-budget-min "$IN_TIME" --max-spend-usd "$IN_SPEND"
          if [ -n "$IN_MODEL" ]; then set -- "$@" --model "$IN_MODEL"; fi
          if [ "$IN_RETRY" = "true" ]; then set -- "$@" --retry-failed; fi
          Rscript 03_reextract_all.r "$@"
          Rscript 03_reextract_all.r --track "$IN_TRACK" --merge

      - name: Commit staging files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/staging_v2
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Re-extraction chunk: $(date +%Y-%m-%dT%H:%MZ)"
            git push
          fi
