name: Weekly Synthesis Digest

on:
  schedule:
    # Every Monday at 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      week_end:
        description: "Last day of the week, YYYY-MM-DD, to write a missed week (empty: today)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

# Jobs that write data never run at the same time.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  synthesis:
    # An explicit image, never ubuntu-latest: when ubuntu-latest moved to
    # 26.04 on 2026-11-13, the renv cache key changed and the restore broke
    # for ten days. Try a new image on a branch first, where tests.yml (run
    # on every push) does a cold renv restore on it.
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup R (pinned)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Setup renv and restore packages
        uses: r-lib/actions/setup-renv@v2

      - name: Run weekly synthesis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Passed through the environment, never pasted into the script.
          WEEK_END: ${{ inputs.week_end }}
        run: |
          Rscript 02_weekly_synthesis.r ${WEEK_END:+--week-end "$WEEK_END"}

      - name: Commit digest files to GitHub
        id: commit
        env:
          WEEK_END: ${{ inputs.week_end }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/weekly_digest.xml data/weekly_digest.json data/weekly_digests

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly synthesis: week ending ${WEEK_END:-$(date +%Y-%m-%d)}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Hugging Face Space
        if: steps.commit.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash tools/deploy_space.sh "https://fmegahed:${HF_TOKEN}@huggingface.co/spaces/fmegahed/arxiv_control_charts"
